name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: pip install -r requirements-dev.txt
      - run: npm ci
      - name: Python lint, format, strict types
        run: |
          ruff check .
          ruff format --check .
          mypy
      - name: Consistency checks
        run: python3 dashboard/build.py --check
      - name: JS/CSS/HTML/Markdown lint, strict types, formatting
        run: npm run lint
