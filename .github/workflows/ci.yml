name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: pip install -r requirements-dev.txt
      - run: npm ci
      - name: Python lint, format, strict types
        run: |
          ruff check .
          ruff format --check .
          python -m mypy
      - name: JS/CSS/HTML/Markdown lint, strict types, formatting
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: pip install -r requirements-dev.txt
      - run: npm ci
      - name: Unit and data tests (pytest)
        run: python -m pytest -v
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: End-to-end dashboard tests (Playwright)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
