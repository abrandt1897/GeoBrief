name: Deploy dashboard to Pages

# Deploy only after CI passes on main, so a broken build never goes live.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      # A manual run skips CI, so run the unit and data tests here first.
      - name: Tests (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        run: pip install -r requirements-dev.txt && python3 -m pytest -q
      - name: Build
        run: python3 dashboard/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dashboard/dist
      - id: deployment
        uses: actions/deploy-pages@v4
