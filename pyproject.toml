[project]
name = "geobrief"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["node_modules", "dashboard/dist"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "N", "RUF", "C4", "PTH", "ANN", "PL", "TRY", "RET"]
ignore = ["PLR2004", "TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["dashboard/build.py", "tests"]
mypy_path = "dashboard"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["dashboard"]
addopts = "-q"
